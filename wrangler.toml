name = "troop690"
main = "worker/index.ts"
compatibility_date = "2026-08-25"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "troop690"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "troop690-files"

[vars]
PUBLIC_SITE_URL = "https://troop690.org"
INTERIM_SITE_URL = "https://troop690.ryannicol.com"
SESSION_TTL_DAYS = "30"
